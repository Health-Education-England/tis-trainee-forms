# ==============================================================================
# Local Testing — Combined Admin + Trainee Token
# ==============================================================================
# Use the following JWT as the Authorization header to authenticate as a local
# user with BOTH admin and trainee access:
#
#   Admin role:  NHSE_LTFT_Admin
#   Admin groups (DBCs): NW London (1-1RUZV6H), North Central and East London
#                        (1-1RUZV4H), South London (1-1RSSQ5L), South West (1-1RUZUVB)
#   Trainee ID:  47165
#   LTFT feature: enabled (qualifying programme: f1e1270f-3697-4801-910e-04645bb80198)
#
# Authorization header value:
#   eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..bG9jYWwtZGV2LWR1bW15LXNpZ25hdHVyZS12YWx1ZQ
#
# Decoded payload:
#   {
#     "sub": "local-admin-user",
#     "custom:tisId": "47165",
#     "email": "admin@local.nhs.uk",
#     "given_name": "Local",
#     "family_name": "Admin",
#     "cognito:roles": ["NHSE LTFT Admin"],
#     "cognito:groups": ["1-1RUZV6H", "1-1RUZV4H", "1-1RSSQ5L", "1-1RUZUVB"],
#     "features": {
#       "forms": {
#         "ltft": {
#           "enabled": true,
#           "qualifyingProgrammes": ["f1e1270f-3697-4801-910e-04645bb80198"]
#         }
#       }
#     }
#   }
#
# Example curl (admin endpoint):
#   curl -H "Authorization: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..bG9jYWwtZGV2LWR1bW15LXNpZ25hdHVyZS12YWx1ZQ" \
#        http://localhost:8207/forms/api/admin/ltft
#
# Example curl (trainee endpoint — submit LTFT):
#   curl -X PUT -H "Authorization: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..bG9jYWwtZGV2LWR1bW15LXNpZ25hdHVyZS12YWx1ZQ" \
#        http://localhost:8207/forms/api/ltft/{id}/submit
# ==============================================================================

application:
  environment: local
  file-store:
    bucket: tis-trainee-documents-upload-local
  aws:
    sns:
      pdf-generated: arn:aws:sns:eu-west-2:${local.account-id}:tis-trainee-pdf-generated
      ltft-assignment-updated: arn:aws:sns:eu-west-2:${local.account-id}:tis-trainee-update-assignment-event
      ltft-refresh: arn:aws:sns:eu-west-2:${local.account-id}:tis-trainee-forms-ltft-refresh-event
      ltft-status-updated: arn:aws:sns:eu-west-2:${local.account-id}:tis-trainee-update-form-event
      ltft-content-updated: arn:aws:sns:eu-west-2:${local.account-id}:tis-trainee-update-form-event
    sqs:
      coj-received: ${local.sqs-path}/tis-trainee-forms-local-coj-received
      notification-event: ${local.sqs-path}/tis-trainee-forms-local-notification-event
      profile-move: ${local.sqs-path}/tis-trainee-forms-local-profile-move
  review-workflows:
    "1-1RUZV6H": # NW London
      - label: "Programme/Education Team Triage"
        enabled: true
      - label: "Programme Manager Review"
        enabled: true
      - label: "Associate Dean Approval"
        enabled: true
    "1-1RUZV4H": # North Central and East London
      - label: "Programme/Education Team Triage"
        enabled: false
      - label: "Education Team Review"
        enabled: true
      - label: "APD Approval"
        enabled: true
    "1-1RSSQ5L": # South London
      - label: "Completeness checks"
        enabled: true
    "1-1RUZUVB": # South West (legacy, no longer active)
      - label: "Programme/Education Team Triage"
        enabled: false
  schedules:
    publish-all-formr-partas: "-"
    publish-all-formr-partbs: "-"
    publish-all-ltfts: "-"
  signature:
    secret-key: ${SIGNATURE_SECRET_KEY:not-very-secret-plain-text-value}

local:
  account-id: "000000000000"
  sqs-path: ${spring.cloud.aws.endpoint}/${local.account-id}

spring:
  cloud:
    aws:
      credentials:
        access-key: ${local.account-id}
        secret-key: ${local.account-id}
      endpoint: http://${LOCALSTACK_HOST:localhost}:4566
      region:
        static: eu-west-2
      s3:
        path-style-access-enabled: true

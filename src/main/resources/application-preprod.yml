        enabled: false
    "1-1RSSQ6R": # Thames Valley
      - label: "Application Check"
        enabled: true
      - label: "Eligibility Review"
        enabled: true
      - label: "Programme Team Review"
        enabled: true
    "1-1RUZUSF": # Wessex
      - label: "Application Check"
        enabled: true
      - label: "Eligibility Review"
        enabled: true
      - label: "Programme Team Review"
        enabled: true

